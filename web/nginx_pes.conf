# ===============================================================
# Nginx Configuration for pes.minhgame.com
# Copy this block into /etc/nginx/sites-available/pes.minhgame.com
# or /etc/nginx/conf.d/pes.minhgame.conf
# ===============================================================

server {
    listen 80;
    server_name pes.minhgame.com;
    root /var/www/pes.minhgame.com/web;
    index index.php index.html;

    # Maximum file upload size (5GB)
    client_max_body_size 5000M;

    # High performance streaming for large files
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;

    # Enable CORS
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, HEAD, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Range, Content-Type, X-Admin-Key' always;
    add_header Access-Control-Expose-Headers 'Content-Range, Content-Length, Accept-Ranges' always;

    # Route /version.json to dynamic PHP handler
    location = /version.json {
        try_files /api/version.php =404;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # Adjust PHP version if needed
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/version.php;
    }

    # Direct static file serving for .zip with Range support
    location ~* \.zip$ {
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin * always;
        max_ranges 1;
        expires max;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # Adjust to your php-fpm path
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 3600;
    }
}
